name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read          # tests never need to write to the repo

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q --ignore=tests/test_dashboard_dom.py

  dashboard-dom:
    name: Dashboard in a real DOM (jsdom)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/web/package-lock.json
      - run: pip install -e ".[dev]"
      - run: npm ci --prefix tests/web
      - run: python -m pytest tests/test_dashboard_dom.py -q

  package:
    name: Build and smoke-test the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build --wheel
      - name: Install the wheel in a clean venv, away from the source tree
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          cd "$(mktemp -d)"
          /tmp/venv/bin/snb --version
          /tmp/venv/bin/snb doctor --offline
