name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read          # tests never need to write to the repo

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q --ignore=tests/test_dashboard_dom.py

  dashboard-dom:
    name: Dashboard in a real DOM (jsdom)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/web/package-lock.json
      - run: pip install -e ".[dev]"
      - run: npm ci --prefix tests/web
      - run: python -m pytest tests/test_dashboard_dom.py -q

  package:
    name: Build and smoke-test the wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build --wheel
      - name: Install the wheel in a clean venv, away from the source tree
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          cd "$(mktemp -d)"
          /tmp/venv/bin/snb --version
          /tmp/venv/bin/snb doctor --offline


  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pip-audit

  container-smoke:
    name: Container build and smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f deployment/Dockerfile -t security-network-builder:ci .
      - name: Start container
        run: docker run -d --name snb-ci -p 18000:8000 -e SNB_ENV=development security-network-builder:ci
      - name: Wait for health endpoint
        run: |
          python - <<'PY'
          import time
          import urllib.error
          import urllib.request

          url = "http://127.0.0.1:18000/api/health"
          for _ in range(30):
              try:
                  with urllib.request.urlopen(url, timeout=2) as response:
                      if response.status == 200:
                          raise SystemExit(0)
              except (urllib.error.URLError, TimeoutError, ConnectionResetError):
                  time.sleep(1)
          raise SystemExit("container health check did not become ready")
          PY
      - name: Verify readiness endpoint
        run: python -c 'import json,urllib.request; print(json.load(urllib.request.urlopen("http://127.0.0.1:18000/api/readiness")))'
      - name: Show container logs on failure
        if: failure()
        run: docker logs snb-ci
      - name: Stop container
        if: always()
        run: docker rm -f snb-ci || true
