services:
  snb:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    env_file:
      - .env
    expose:
      - "8000"
    volumes:
      - ../data:/app/data
      - ../reports:/app/reports
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - snb
    ports:
      - "8765:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
