services:
  - type: web
    name: security-network-builder
    runtime: docker
    dockerfilePath: ./deployment/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: GITHUB_TOKEN
        sync: false
      - key: AI_PROVIDER
        value: offline
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-5
      - key: API_KEYS
        sync: false
      - key: SNB_ENV
        value: production
