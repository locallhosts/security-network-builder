[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "security-network-builder"
dynamic = ["version"]
description = "Discover, analyze and rank security engineers on GitHub by technical domain."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["requests>=2.31", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
snb = "snb.main:main"

[tool.setuptools.dynamic]
version = { attr = "snb.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
snb = ["default_profile.yaml"]
