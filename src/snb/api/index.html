<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Security Network Builder</title><style>body{font-family:system-ui;max-width:1000px;margin:auto;padding:30px;background:#0b1020;color:#e8edf7}input,button{padding:10px;border-radius:8px;border:1px solid #334155;background:#111827;color:inherit}input{width:70%}.card{background:#111827;border:1px solid #263247;border-radius:12px;padding:18px;margin:16px 0}.result{padding:12px 0;border-bottom:1px solid #263247}svg{width:100%;height:500px;background:#080d18}.muted{color:#94a3b8}</style></head><body><h1>Security Network Builder</h1><p class="muted">Security engineer discovery and community intelligence from public GitHub signals.</p><div class="card"><h2>Interactive search</h2><form id="search"><input id="q" minlength="2" placeholder="ebpf security, cloud security" required><button>Search</button></form><div id="results" class="muted">Search public GitHub repositories.</div></div><div class="card"><h2>Community security graph</h2><svg id="graph" viewBox="0 0 1000 500"></svg></div><script>const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));document.querySelector('#search').onsubmit=async e=>{e.preventDefault();let q=document.querySelector('#q').value.trim(),o=document.querySelector('#results');o.textContent='Searching...';try{let r=await fetch('/api/search?q='+encodeURIComponent(q)),d=await r.json();if(!r.ok)throw Error(d.detail||'Search failed');o.innerHTML=d.results.map(x=>'<div class="result"><b>'+esc(x.repository)+'</b> — '+esc(x.description||'No description')+'<br><span class="muted">'+esc(x.language||'Unknown')+' · ★ '+x.stars+' · <a href="'+esc(x.url)+'" target="_blank" rel="noopener">GitHub</a></span></div>').join('')||'No results.'}catch(x){o.textContent=x.message}};</script></body></html>
